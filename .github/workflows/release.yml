name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build mobile artifacts
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install gomobile
        run: make init

      - name: Verify package
        run: go test ./...

      - name: Build Android and iOS artifacts
        run: make build-all build-source-jar package-ios checksums

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: genotp-mobile-artifacts
          path: |
            genotp.aar
            Genotp.xcframework.zip
            genotp-sources.jar
            SHA256SUMS

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            genotp.aar
            Genotp.xcframework.zip
            genotp-sources.jar
            SHA256SUMS
